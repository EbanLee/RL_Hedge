market:
  S0: 100.0 # 초기 주가
  K: 100.0
  maturity_days: 30
  days_per_year: 365
  n_steps: 30
  substeps: 32  # 한 구간에서 세분화 횟수

heston:
  mode: fixed  # fixed 또는 random

  fixed:
    V0: 0.04  # 초기 분산
    kappa: 1.0  # 분산이 장기평균으로 돌아오는 속도
    theta: 0.04 # 평균 장기 분산
    xi: 2.0 # 분산의 변동성 (vol of vol)
    rho: -0.7 # 주가와 변동성의 상관

  # mode가 random일 때, 쓰는 범위
  ranges:
    V0: [0.01, 0.09]
    kappa: [0.5, 3.0]
    theta: [0.01, 0.09]
    xi: [0.2, 2.0]
    rho: [-0.9, 0.3]

dataset:
  n_paths: 100000
  train_ratio: 0.8
  seed: null
  data_dir: data/heston
